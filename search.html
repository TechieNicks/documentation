<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search documentation — TechieNicks</title>
    <meta name="description" content="Search TechieNicks technical documentation and reference guides.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="icon" href="images/favicon-transparent-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/engagement.css">
    <link rel="stylesheet" href="chatbot/chatbot.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="index.html">
                <img src="images/favicon.png" alt="TechieNicks logo" width="36" height="36">
                TechieNicks
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="techspec.html">TechSpec</a>
                <a href="search.html" class="active" aria-current="page">Search</a>
                <a href="contact.html">Contact</a>
                <a href="https://www.youtube.com/@techienicks" target="_blank" rel="noopener">YouTube</a>
            </nav>
            <div class="nav-right">
                <button class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41-1.41M17.66 6.34l-1.41-1.41" />
                    </svg>
                </button>
                <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-label="Toggle menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M3 12h18M3 18h18" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <span class="eyebrow">// documentation search</span>
                <div class="page-hero-heading">
                    <h1>Find a <span class="gradient-text">guide or topic.</span></h1>
                    <div class="engagement engagement--hero" data-engagement></div>
                </div>
                <p class="lead" style="max-width:60ch;">Search across the TechieNicks reference guides, commands, and
                    documented topics.</p>
            </div>
        </section>

        <section>
            <div class="container">
                <form class="doc-search" id="docSearchForm" role="search">
                    <label for="docSearchInput">Search documentation</label>
                    <div class="doc-search__control">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>
                        <input id="docSearchInput" type="search" placeholder="Try Git, branching, Jira, REST API..."
                            autocomplete="off">
                    </div>
                    <p class="doc-search__status" id="docSearchStatus" aria-live="polite"></p>
                </form>
                <div class="search-results" id="searchResults"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            &copy; <span id="year"></span> Copyright by <i class="fas fa-heartbeat"></i>
            <a href="https://github.com/nicks9188" target="_blank" rel="noopener">TechieNicks</a>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/engagement.js"></script>
    <script src="chatbot/chatbot.js"></script>
    <script src="js/search.js"></script>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>

</html>
