    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Highlight the active TOC entry as you scroll
        const tocLinks = document.querySelectorAll('.doc-toc nav a');
        const targets = Array.from(tocLinks).map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
        const setActive = () => {
            let current = targets[0];
            for (const t of targets) {
                if (t.getBoundingClientRect().top - 100 <= 0) current = t;
            }
            tocLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current.id));
        };
        document.addEventListener('scroll', setActive, { passive: true });
        setActive();
